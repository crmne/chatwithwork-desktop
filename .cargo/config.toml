# whisper-rs generates bindings for the target's C ABI with libclang. Its
# bundled fallback includes Linux libc layouts and cannot be used on Windows.
[env]
# Portable binaries must not require the build machine's CPU instructions.
GGML_NATIVE = "OFF"
GGML_SSE42 = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_BMI2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"

# Link the C runtime statically on Windows. A fresh Windows install has no
# Visual C++ Redistributable, and cww.exe, cww-agent.exe and cww-app.exe
# would fail to start without VCRUNTIME140.dll (0xC0000135). The cc and cmake
# crates build C and C++ dependencies with the matching /MT runtime.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
