# whisper-rs generates bindings for the target's C ABI with libclang. Its
# bundled fallback includes Linux libc layouts and cannot be used on Windows.
[env]
# The oldest macOS the binaries run on, as the bundled Node runtime needs
# (Node 26: 13.5). Info.plist, the installer and Homebrew say the same;
# packaging/test-packaging.py keeps them together. Other targets ignore it.
MACOSX_DEPLOYMENT_TARGET = "13.5"
# Portable binaries must not require the build machine's CPU instructions.
GGML_NATIVE = "OFF"
GGML_SSE42 = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_BMI2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
# whisper-rs-sys passes CMAKE_* variables to whisper.cpp's CMake build, whose
# old cmake_minimum_required leaves the MSVC runtime at /MD. Use the static
# runtime (/MT) to match crt-static below; other platforms ignore both.
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"

# Link the C runtime statically on Windows. A fresh Windows install has no
# Visual C++ Redistributable, and cww.exe, cww-agent.exe and cww-app.exe
# would fail to start without VCRUNTIME140.dll (0xC0000135). The cc crate builds
# C dependencies with the matching /MT runtime, and whisper.cpp follows
# CMAKE_MSVC_RUNTIME_LIBRARY above.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
