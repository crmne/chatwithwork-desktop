name: Speech build dependencies
description: CMake, target-specific Whisper bindings and fastframe-audio's PipeWire bindings for desktop builds
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      # fastframe-audio always builds cpal's PipeWire host on Linux, which
      # generates bindings to libpipewire with clang.
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev pkg-config cmake clang libclang-dev
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        brew list llvm >/dev/null 2>&1 || brew install llvm
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $clang = 'C:\Program Files\LLVM\bin'
        if (!(Test-Path "$clang\libclang.dll")) { throw 'The runner needs LLVM with libclang.dll' }
        "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
