name: Desktop build dependencies
description: The Tauri window's system libraries on Linux (WebKitGTK, GTK, the tray's AppIndicator), CMake, target-specific Whisper bindings and fastframe-audio's PipeWire bindings for desktop builds
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      # fastframe-audio always builds cpal's PipeWire host on Linux, which
      # generates bindings to libpipewire with clang. Tauri draws with
      # WebKitGTK 4.1 and GTK 3, and its tray item uses AppIndicator.
      run: >-
        sudo apt-get update && sudo apt-get install -y
        libasound2-dev libpipewire-0.3-dev pkg-config cmake clang libclang-dev
        libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libdbus-1-dev
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        brew list llvm >/dev/null 2>&1 || brew install llvm
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $clang = 'C:\Program Files\LLVM\bin'
        if (!(Test-Path "$clang\libclang.dll")) { throw 'The runner needs LLVM with libclang.dll' }
        "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    # A restored build cache keeps whisper.cpp's CMake build folder, and
    # CMake keeps the tools it found there in its cache. When the runner
    # image brings another Visual Studio or Xcode, those paths are gone and
    # the next configure stops: "The CMAKE_ASM_COMPILER: ... is not a full
    # path to an existing compiler tool". Forget what CMake found in such a
    # folder, so it looks again; the libraries already built stay for a
    # build script that doesn't run again.
    - shell: bash
      run: |
        [ -d target ] || exit 0
        find -L target -maxdepth 9 \( -name deps -o -name incremental -o -name .fingerprint \) -prune \
          -o -name CMakeCache.txt -print | while IFS= read -r cache; do
          sed -n -E 's/^[A-Za-z0-9_.-]+:(FILEPATH|INTERNAL)=(([A-Za-z]:)?\/.*)$/\2/p' "$cache" | while IFS= read -r tool; do
            if [ ! -e "$tool" ]; then
              echo "CMake's cache in ${cache%/*} names $tool, which this runner doesn't have: configuring it again"
              rm -rf "$cache" "${cache%/*}/CMakeFiles"
              break
            fi
          done
        done
