name: Desktop build dependencies
description: The Tauri window's system libraries on Linux (WebKitGTK, GTK, the tray's AppIndicator), CMake, target-specific Whisper bindings and fastframe-audio's PipeWire bindings for desktop builds
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      # fastframe-audio always builds cpal's PipeWire host on Linux, which
      # generates bindings to libpipewire with clang. Tauri draws with
      # WebKitGTK 4.1 and GTK 3, and its tray item uses AppIndicator.
      run: >-
        sudo apt-get update && sudo apt-get install -y
        libasound2-dev libpipewire-0.3-dev pkg-config cmake clang libclang-dev
        libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libdbus-1-dev
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        brew list llvm >/dev/null 2>&1 || brew install llvm
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $clang = 'C:\Program Files\LLVM\bin'
        if (!(Test-Path "$clang\libclang.dll")) { throw 'The runner needs LLVM with libclang.dll' }
        "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
