name: Release

# A v* tag builds every platform, publishes the GitHub release, then hands
# over to packaging.yml for .deb, .rpm, AUR, Homebrew and WinGet recipes.
# Each release carries the desktop app with cww beside it: a notarized .dmg
# and a .pkg on macOS, an MSI per architecture on Windows, and archives for
# Linux. PACKAGING.md ("Release assets") lists every file
# and what uses it; add nothing nobody downloads.
# Running it by hand builds everything the same way without publishing, to
# try a change to this workflow before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-source:
    name: tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the release commit on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit already on origin/main." >&2
            exit 1
          fi
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version."
            exit 1
          fi
          app_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' app/Cargo.toml | head -n 1)
          if [ "$app_version" != "$version" ]; then
            echo "::error::The app and agent versions must match."
            exit 1
          fi
          helper_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' notification-broker/Cargo.toml | head -n 1)
          if [ "$helper_version" != "$version" ]; then
            echo "::error::The notification helper and agent versions must match."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "$GITHUB_REF_NAME" != *-* ]]; then
            test -s "packaging/release-notes/$GITHUB_REF_NAME.md" || {
              echo "::error::Commit the release notes before tagging."
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: release-source
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    # A tag's Windows jobs sign in to Azure Artifact Signing as the app
    # registration that trusts only this environment, which deploys only
    # from v* tags (PACKAGING.md, "Windows"). Its variables are set there;
    # a run by hand or on Linux has none and signs nothing.
    environment: ${{ startsWith(matrix.os, 'windows') && startsWith(github.ref, 'refs/tags/v') && 'windows-signing' || '' }}
    # An uncached release build with LTO of cww and the desktop app takes
    # more than 30 minutes on the Windows runners.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries run on any Linux distribution.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            msi-arch: x64
          # Cross-compiled from x64; ring builds its assembly with the
          # runner's clang.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            msi-arch: arm64
    env:
      VERSION: ${{ needs.release-source.outputs.version }}
      # A code signing certificate as an alternative to Azure Artifact
      # Signing, used only while the windows-signing environment names no
      # certificate profile.
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: jdx/mr-boxington-action@v1
        with:
          backend: local
      # No compiler cache: published binaries never build from outputs
      # restored from an Actions cache.
      - run: mbx build --locked --release --target ${{ matrix.target }} --bins
      # Built on its own so cww's binaries come out as they always have. The
      # Linux app needs glibc, so it's built by the linux-app job.
      - uses: ./.github/actions/speech-build
        if: runner.os == 'Windows'
      - name: Build the desktop app
        if: runner.os == 'Windows'
        run: mbx build --locked --release --target ${{ matrix.target }} -p cww-app --bin cww-app

      # The desktop app's scanner helper, 32-bit on both Windows targets
      # (most TWAIN drivers are), with the TWAIN Working Group's TWAINDSM.dll.
      - name: Build the 32-bit scanner helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup target add i686-pc-windows-msvc
          mbx build --locked --release --target i686-pc-windows-msvc -p cww-scan --bin cww-scan-helper
          if ($LASTEXITCODE -ne 0) { throw 'The scanner helper did not build' }
          Copy-Item target/i686-pc-windows-msvc/release/cww-scan-helper.exe target/${{ matrix.target }}/release/
          ./packaging/windows/twain-dsm.ps1 -Destination target/${{ matrix.target }}/release

      - name: Build the CLI notification helper
        if: runner.os == 'Linux'
        run: mbx build --locked --release --target ${{ matrix.target }} -p cww-notification-broker --bin cww-notify
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux'
        with:
          ruby-version: '4.0'

      - name: Check the binary is static
        if: runner.os == 'Linux'
        run: |
          for name in cww cww-notify; do
            bin="target/${{ matrix.target }}/release/$name"
            dynamic="$(readelf -d "$bin")"
            program="$(readelf -l "$bin")"
            if [[ "$dynamic" == *NEEDED* || "$program" == *INTERP* ]]; then
              echo "::error::$bin must be fully static"
              exit 1
            fi
            "$bin" --version
          done

      - name: Check the Windows binaries need no Visual C++ Redistributable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "target\${{ matrix.target }}\release"
          ./packaging/windows/check-runtime.ps1 "$release\cww.exe" "$release\cww-agent.exe" "$release\cww-app.exe" "$release\cww-scan-helper.exe" "$release\TWAINDSM.dll"

      - name: Sign in to Azure for code signing
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign binaries (Azure Artifact Signing)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\${{ matrix.target }}\release\cww.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\cww-agent.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\cww-app.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\cww-scan-helper.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Chat with Work Desktop
          description-url: https://chatwithwork.com
          # Only the Azure CLI sign-in above: no secrets, no other identity.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
      - name: Sign binaries (certificate)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_PROFILE == '' && env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          ./packaging/windows/sign.ps1 `
            "target\${{ matrix.target }}\release\cww.exe" `
            "target\${{ matrix.target }}\release\cww-agent.exe" `
            "target\${{ matrix.target }}\release\cww-app.exe" `
            "target\${{ matrix.target }}\release\cww-scan-helper.exe"

      # Windows ships only the MSIs (below); nothing read a portable zip.
      - name: Terminal-only archive
        if: runner.os == 'Linux'
        run: |
          ruby packaging/linux/cli-archive.rb \
            "target/${{ matrix.target }}/release/cww" \
            "target/${{ matrix.target }}/release/cww-notify" \
            "$VERSION" "${{ matrix.target }}" dist

      # WiX 5 is a .NET tool; the runner has the SDK.
      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          ./packaging/windows/build-msi.ps1 -Version $env:VERSION -Arch ${{ matrix.msi-arch }} `
            -Binary "target\${{ matrix.target }}\release\cww.exe" `
            -Output "dist\cww-v$($env:VERSION)-${{ matrix.target }}.msi"
          Remove-Item dist\*.wixpdb
      - name: Sign installer (Azure Artifact Signing)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Chat with Work Desktop
          description-url: https://chatwithwork.com
          # Only the Azure CLI sign-in above: no secrets, no other identity.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
      - name: Sign installer (certificate)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_PROFILE == '' && env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: ./packaging/windows/sign.ps1 (Get-ChildItem dist\*.msi).FullName
      - name: Check the signatures
        if: runner.os == 'Windows' && (vars.AZURE_SIGNING_PROFILE != '' || env.WINDOWS_CERTIFICATE_PFX != '')
        shell: pwsh
        run: |
          $release = "target\${{ matrix.target }}\release"
          $files = "$release\cww.exe", "$release\cww-agent.exe", "$release\cww-app.exe", "$release\cww-scan-helper.exe"
          $files += (Get-ChildItem dist\*.msi).FullName
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              throw "$file is not validly signed and timestamped: $($signature.Status) $($signature.StatusMessage)"
            }
            "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Attest release packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: crmne/native-packages/.github/actions/attest@226fb48cb375c7cb309a3e642c7228a6e00e9ebf # v0.10.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.msi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: release-source
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-latest
    # Four release builds and three notarizations.
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.release-source.outputs.version }}
      # Complete Apple credentials make native-packages sign the binary with
      # Developer ID and the hardened runtime, and notarize it, and sign and
      # notarize the desktop app and its disk image.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      # A Developer ID Installer identity signs the .pkg, which is then
      # notarized and stapled with the credentials above.
      APPLE_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: jdx/mr-boxington-action@v1
        with:
          backend: local
      # No compiler cache, as above.
      - uses: ./.github/actions/speech-build
      - name: Build both architectures
        run: |
          mbx build --locked --release --target aarch64-apple-darwin --bin cww
          mbx build --locked --release --target x86_64-apple-darwin --bin cww
      # Built on its own so cww comes out as it always has.
      - name: Build the desktop app for both architectures
        run: |
          mbx build --locked --release --target aarch64-apple-darwin -p cww-app --bin cww-app
          mbx build --locked --release --target x86_64-apple-darwin -p cww-app --bin cww-app

      - name: Universal binaries
        run: |
          mkdir -p universal
          for bin in cww cww-app; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              -output "universal/$bin"
            lipo "universal/$bin" -verify_arch x86_64 arm64
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native packaging
        run: gem install native-packages --version 0.10.0 --no-document

      - name: Sign and notarize the universal binary
        run: |
          name="cww-v${VERSION}-macos-universal"
          mkdir -p "$RUNNER_TEMP/portable-input" dist
          cp universal/cww README.md PROTOCOL.md CONTROL.md SECURITY.md LICENSE-MIT LICENSE-APACHE "$RUNNER_TEMP/portable-input/"
          native-packages notarize-macos "$RUNNER_TEMP/portable-input" \
            --output "$RUNNER_TEMP/signed-portable/$name"
          tar -C "$RUNNER_TEMP/signed-portable" -czf "dist/$name.tar.gz" "$name"
          cp "$RUNNER_TEMP/signed-portable/$name/cww" "$RUNNER_TEMP/cww-signed"

      - name: Verify the signature
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/cww-signed"
          codesign --display --verbose=2 "$RUNNER_TEMP/cww-signed" 2>&1 | grep -q "flags=0x10000(runtime)"

      # The desktop app: the steps the desktop-preview workflow proved. The
      # bundle carries cww next to cww-app, both signed with the hardened
      # runtime; the app and the disk image are each notarized and stapled.
      # Without the Apple secrets the bundle gets an ad-hoc signature.
      - name: Import the Developer ID Application identity
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/cww-app.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/app.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Bundle and sign the desktop app
        run: |
          app="$RUNNER_TEMP/app/Chat with Work.app"
          mkdir -p "$RUNNER_TEMP/app"
          CODESIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" packaging/macos/bundle.sh \
            universal/cww-app universal/cww "$app" "$VERSION"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --display --verbose=2 "$app" 2>&1 | grep -q "flags=0x10000(runtime)"
            codesign --display --verbose=2 "$app/Contents/MacOS/cww" 2>&1 | grep -q "flags=0x10000(runtime)"
          fi

      - name: Notarize and staple the desktop app
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          app="$RUNNER_TEMP/app/Chat with Work.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize-app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize-app.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary-app.json"
          id=$(plutil -extract id raw "$RUNNER_TEMP/notary-app.json")
          xcrun notarytool log "$id" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            "$RUNNER_TEMP/notary-log-app.json"
          cat "$RUNNER_TEMP/notary-log-app.json"
          test "$(plutil -extract status raw "$RUNNER_TEMP/notary-app.json")" = Accepted
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Installer package
        run: |
          if [ -n "$APPLE_INSTALLER_CERTIFICATE_P12" ]; then
            APPLE_INSTALLER_KEYCHAIN=$(bash packaging/macos/import-installer-identity.sh)
            export APPLE_INSTALLER_KEYCHAIN
          fi
          bash packaging/macos/pkg.sh "$RUNNER_TEMP/cww-signed" "$VERSION" \
            "dist/cww-v${VERSION}-macos-universal.pkg" "$RUNNER_TEMP/app/Chat with Work.app"

      - name: Add the desktop app to the Homebrew and shell-installer archive
        run: |
          name="cww-v${VERSION}-macos-universal"
          ditto "$RUNNER_TEMP/app/Chat with Work.app" "$RUNNER_TEMP/signed-portable/$name/Chat with Work.app"
          tar -C "$RUNNER_TEMP/signed-portable" -czf "dist/$name.tar.gz" "$name"

      # The disk image is the app's only download of its own: the .pkg and
      # the Homebrew and shell-installer archive carry the same app.
      - name: Desktop app disk image
        run: |
          app="$RUNNER_TEMP/app/Chat with Work.app"
          dmg="dist/chat-with-work-v${VERSION}-macos-universal.dmg"
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto "$app" "$staging/Chat with Work.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Chat with Work" -srcfolder "$staging" \
            -fs HFS+ -format UDZO -ov "$dmg"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
              --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary-dmg.json"
            id=$(plutil -extract id raw "$RUNNER_TEMP/notary-dmg.json")
            xcrun notarytool log "$id" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
              "$RUNNER_TEMP/notary-log-dmg.json"
            cat "$RUNNER_TEMP/notary-log-dmg.json"
            test "$(plutil -extract status raw "$RUNNER_TEMP/notary-dmg.json")" = Accepted
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          fi
          ls -la dist

      - name: Attest macOS packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: crmne/native-packages/.github/actions/attest@226fb48cb375c7cb309a3e642c7228a6e00e9ebf # v0.10.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.pkg
            dist/*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: |
            dist/*.tar.gz
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error

  # The desktop app for Linux, with the static cww from the build job beside
  # it. The app links only the C library and loads Wayland, X11 and OpenGL
  # at run time, so it's built against Ubuntu 24.04's glibc 2.39 to run on
  # that and every newer distribution. Older releases' PipeWire is too old
  # for the bindings fastframe-audio's PipeWire host builds.
  linux-app:
    name: desktop app (${{ matrix.target }})
    needs: [release-source, build]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cww-target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cww-target: aarch64-unknown-linux-musl
    env:
      VERSION: ${{ needs.release-source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: jdx/mr-boxington-action@v1
        with:
          backend: local
      # No compiler cache, as above.
      - uses: ./.github/actions/speech-build
      - run: mbx build --locked --release --target ${{ matrix.target }} -p cww-app --bin cww-app

      - name: Check the app needs only C, C++, ALSA, PipeWire, GTK and WebKitGTK libraries, glibc 2.39 or older
        run: |
          bin="target/${{ matrix.target }}/release/cww-app"
          readelf -d "$bin" | grep NEEDED
          # The packages depend on exactly these (native-packages.yaml).
          if readelf -d "$bin" | grep NEEDED | grep -vE '\[(libasound\.so\.2|libpipewire-0\.3\.so\.0|libwebkit2gtk-4\.1\.so\.0|libjavascriptcoregtk-4\.1\.so\.0|libsoup-3\.0\.so\.0|lib(gtk|gdk)-3\.so\.0|libgdk_pixbuf-2\.0\.so\.0|lib(glib|gobject|gio|gmodule)-2\.0\.so\.0|libcairo(-gobject)?\.so\.2|libpango(cairo)?-1\.0\.so\.0|libharfbuzz\.so\.0|libatk-1\.0\.so\.0|libdbus-1\.so\.3|libc\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libstdc\+\+\.so\.6|ld-linux-[a-z0-9-]+\.so\.[0-9])\]'; then
            echo "::error::$bin links more than the C, C++, ALSA, PipeWire, GTK and WebKitGTK libraries"
            exit 1
          fi
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "Newest glibc symbol: $newest"
          if [ "$(printf '%s\n' GLIBC_2.39 "$newest" | sort -V | tail -n 1)" != GLIBC_2.39 ]; then
            echo "::error::$bin needs $newest"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.cww-target }}
          path: cww-archive

      - name: Package
        run: |
          cww_name="cww-v${VERSION}-${{ matrix.cww-target }}"
          tar -xzf "cww-archive/$cww_name.tar.gz" -C "$RUNNER_TEMP"
          bash packaging/linux/archive.sh "$RUNNER_TEMP/$cww_name/cww" \
            "target/${{ matrix.target }}/release/cww-app" "$VERSION" "${{ matrix.target }}" dist
          tar -tzvf "dist/cww-app-v${VERSION}-${{ matrix.target }}.tar.gz"

      - name: Attest the desktop app archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: crmne/native-packages/.github/actions/attest@226fb48cb375c7cb309a3e642c7228a6e00e9ebf # v0.10.0
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-source, build, macos, linux-app]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publishing waits for the maintainer's approval, and only this job can
    # read the release signing key (v* tags only).
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Installer scripts
        run: |
          cp packaging/install.sh dist/cww-installer.sh
          cp packaging/install.ps1 dist/cww-installer.ps1
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > checksums.txt
          cat checksums.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      # Sign checksums.txt (checksums.txt.sig), then check the signature and
      # every listed file, the desktop app's among them, against the committed
      # key. The desktop app's updater carries the key and refuses a release
      # without a valid signature.
      - name: Sign checksums
        env:
          CWW_UPDATE_SIGNING_KEY: ${{ secrets.CWW_UPDATE_SIGNING_KEY }}
        run: |
          gem install native-packages --version 0.10.0 --no-document
          native-packages sign-checksums dist/checksums.txt \
            --public-key app/assets/update-public-key.hex \
            --key-env CWW_UPDATE_SIGNING_KEY
          native-packages verify-checksums dist/checksums.txt \
            --public-key app/assets/update-public-key.hex
      # Publish the reviewed notes committed before the tag, never a
      # generated summary. A stable tag without them stops here; a
      # prerelease without them gets a short placeholder.
      - name: Release notes
        run: |
          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Prerelease build of Chat with Work Desktop ${GITHUB_REF_NAME}." > release-notes.md
          else
            echo "::error::Write $notes and push it before tagging a stable release."
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          name: Chat with Work Desktop ${{ needs.release-source.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  packaging:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: publish
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
