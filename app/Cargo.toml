[package]
name = "cww-app"
version = "0.4.1"
edition = "2024"
# fastframe needs 1.98; the daemon itself builds with 1.90.
rust-version = "1.98"
description = "Chat with Work Desktop: the web app in a native window, the tray item and the background agent's settings"
license = "MIT OR Apache-2.0"
authors = ["Carmine Paolino <carmine@paolino.me>"]
repository = "https://github.com/crmne/chatwithwork-desktop"
homepage = "https://chatwithwork.com"
readme = "../README.md"
publish = false

[[bin]]
name = "cww-app"
path = "src/main.rs"

[build-dependencies]
# Tauri's build step: the context generate_context! embeds (tauri.conf.json,
# the bundled local pages, capabilities) and the commands' permissions. On
# Windows it also embeds the executable's icon and version information.
tauri-build = { version = "2.7", features = [] }

[dependencies]
# The daemon's paths, config and control client, so the app finds its socket
# or pipe exactly where it listens and checks the pipe's owner on Windows,
# and reads which server this computer is paired with.
cww = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
url = "2.5"
# The window, the tray and the bundled local pages. Tauri uses the system
# web view: WebKitGTK on Linux, WKWebView on macOS, WebView2 on Windows.
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
# A second launch (a notification's chat, the applications menu) hands its
# arguments to the running app instead of starting another.
tauri-plugin-single-instance = "2"
# The windows' size, position and maximized state across launches.
tauri-plugin-window-state = "2"
# The native folder picker: NSOpenPanel, IFileDialog, or the XDG portal.
tauri-plugin-dialog = "2"
# Microphone capture stays in the app; the daemon remains a static binary.
# `cww tui` records through `cww-app --record-audio-progress`, through
# fastframe-audio: on Linux it goes to PipeWire, then PulseAudio, then ALSA,
# so building needs libpipewire's headers and clang, and the binary links
# libpipewire-0.3.so.0.
fastframe-audio = { version = "0.14.0", git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
# The recorder's lock-free queue from the capture callback, which must not
# wait.
crossbeam-channel = "0.5"
# Opens links, the config file and the log in their default apps.
open = "5"
# Local times in the tray's last access line.
jiff = "0.2"
# Start at login in the tray: the XDG autostart entry on Linux, a login
# item with the bundle's launch agent on macOS, the Run key on Windows. Same
# release as fastframe-audio.
fastframe-autostart = { version = "0.14.0", git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
# Native delivery for the supervisor's pipe-only notification broker.
cww-notification-broker = { path = "../notification-broker" }
# Waits for the daemon's socket to appear instead of polling for it.
notify = "8.2"
# Random nonces for the loopback callback.
ring = "0.17"
base64 = "0.22"
# The Downloads folder for files the page downloads, and their names.
dirs = "6"
percent-encoding = "2.3"
# Shared async control and demo support.
tokio = { version = "1.53", features = ["sync", "macros"] }
# Only for --demo, whose stand-in daemon uses the real listener.
tokio-util = { version = "0.7", features = ["io-util"], optional = true }

# CPU-only local speech inference for `cww tui` lives in a short-lived app
# helper; no model weights or inference libraries enter the daemon/CLI.
# whisper.cpp's CPU backend doesn't build with MSVC for Windows on Arm.
[target.'cfg(not(all(windows, target_arch = "aarch64")))'.dependencies]
whisper-rs = { version = "0.16.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Failed loads, for the offline page (offline.rs), and pictures of the
# windows in --demo builds (snapshot.rs). Already in the tree through Tauri.
webkit2gtk = "2.0"
# Saves those pictures as PNG.
cairo-rs = { version = "0.18", features = ["png"], optional = true }

[features]
default = ["custom-protocol"]
# Embeds ui/ (the bundled local pages) in the binary and serves it from
# tauri://. Without the Tauri CLI, cargo build needs it on for a release.
custom-protocol = ["tauri/custom-protocol"]
# --demo: runs against a built-in fake daemon with sample folders and
# activity, for screenshots and trying the window. Never in release builds.
demo = ["tokio/rt-multi-thread", "dep:tokio-util", "dep:cairo-rs"]

[dev-dependencies]
tempfile = "3.27"
# The stand-in daemon, and a test that runs the real one.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["io-util"] }
