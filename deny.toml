# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`.

[graph]
# The platforms cww and cww-app ship for.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# Fail on any RustSec advisory (vulnerable, unmaintained, unsound, yanked).
unmaintained = "all"
yanked = "deny"
# The current calamine/docx-rs/rust_xlsxwriter releases still require zip 8.
# Their uses do not extract archives to disk; the affected symlink/permission
# APIs are unreachable. Our direct reader uses zip 9. See docs/zip-review.md.
# This exempts only the yank, not any RustSec advisory. Remove when those
# registry dependencies support zip 9; do not broaden to other versions.
ignore = [
    { crate = "zip@8.6.0", reason = "Document dependencies require zip 8 and do not use its vulnerable disk extraction APIs; see docs/zip-review.md" },
]

[licenses]
# Every license here is compatible with shipping cww as MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots: Mozilla's CA list.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# option-ext (through dirs, for the Documents folder) is MPL-2.0: file-level
# copyleft, fine to link into an MIT/Apache binary. Allowed for it alone.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# The desktop app's clipboard on Windows (arboard) is BSL-1.0: permissive,
# no notice needed in binaries.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

# egui's built-in fonts carry the fonts' own licenses.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# fastframe-fonts bundles Inter and the Noto fallbacks under their own license.
[[licenses.exceptions]]
crate = "fastframe-fonts"
allow = ["OFL-1.1"]

[[licenses.clarify]]
# ring's license file combines ISC, MIT and OpenSSL-derived terms.
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# cww-app isn't published; its path dependency on cww is the workspace's own.
allow-wildcard-paths = true
highlight = "all"
# Native TLS and OpenSSL are never allowed: TLS is rustls with ring only.
deny = [
    { crate = "openssl", reason = "TLS must be rustls" },
    { crate = "openssl-sys", reason = "TLS must be rustls" },
    { crate = "native-tls", reason = "TLS must be rustls" },
    { crate = "aws-lc-sys", reason = "keep the build pure Rust plus ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The desktop app's forks, pinned in Cargo.toml: egui and winit (patched
# until upstream releases the fixes) and fastframe's text rendering.
allow-git = [
    "https://github.com/crmne/egui",
    "https://github.com/crmne/fastframe",
    "https://github.com/crmne/winit",
]
