# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`.

[graph]
# The platforms cww and cww-app ship for.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# Fail on any RustSec advisory (vulnerable, unmaintained, unsound, yanked).
unmaintained = "all"
yanked = "deny"
# docx-rs 0.4.22, the latest release, still requires zip 8 (calamine and
# rust_xlsxwriter have moved to zip 9). Its three advisories concern
# extracting archives to disk, and docx-rs only builds documents in memory. See docs/zip-review.md. Remove these when docx-rs
# supports zip 9.
#
# zbus 6 folded zvariant, zvariant_derive and zbus_names into zbus, so the
# standalone crates are marked unmaintained. They come only
# through keyring's Secret Service store (secret-service and
# zbus-secret-service-keyring-store), whose releases still require zbus 5.
# Remove these when they move to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 8 (GHSA-vv5m-jxxh-4627) through docx-rs, which never extracts archives to disk; see docs/zip-review.md" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8 (GHSA-4v9h-p7m9-rh26) through docx-rs, which never extracts archives to disk; see docs/zip-review.md" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8 (GHSA-4684-h2q9-2vcp) through docx-rs, which never extracts archives to disk; see docs/zip-review.md" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; keyring's Secret Service store still requires zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; keyring's Secret Service store still requires zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; keyring's Secret Service store still requires zbus 5" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: a build-time macro helper of the GTK 3 bindings (glib 0.18) that Tauri's Linux window and tray use; no code of it runs in the app. Remove when Tauri moves to GTK 4" },
]

[licenses]
# Every license here is compatible with shipping cww as MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots: Mozilla's CA list.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# option-ext (through dirs, for the Documents folder) is MPL-2.0: file-level
# copyleft, fine to link into an MIT/Apache binary. Allowed for it alone.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# Servo's CSS parser and selector matching, which Tauri's build and
# config code use to read HTML, are MPL-2.0 too: file-level copyleft, fine
# to link into an MIT/Apache binary, and we ship them unmodified.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

[[licenses.clarify]]
# ring's license file combines ISC, MIT and OpenSSL-derived terms.
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# cww-app isn't published; its path dependency on cww is the workspace's own.
allow-wildcard-paths = true
highlight = "all"
# Native TLS and OpenSSL are never allowed: TLS is rustls with ring only.
deny = [
    { crate = "openssl", reason = "TLS must be rustls" },
    { crate = "openssl-sys", reason = "TLS must be rustls" },
    { crate = "native-tls", reason = "TLS must be rustls" },
    { crate = "aws-lc-sys", reason = "keep the build pure Rust plus ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The desktop app's forks, pinned in Cargo.toml: fastframe (audio,
# notifications and start at login), the cpal fork fastframe-audio records
# through (stream names, RustAudio/cpal#1409), and the command sandbox.
allow-git = [
    "https://github.com/crmne/cpal",
    "https://github.com/crmne/microsoft-mxc",
    "https://github.com/crmne/fastframe",
]
