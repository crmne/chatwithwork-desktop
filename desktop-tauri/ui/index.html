<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat with Work</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Chats">
        <div class="sidebar__head">
          <span class="sidebar__mark" aria-hidden="true"></span>
          <span class="sidebar__name">Chat with Work</span>
        </div>
        <button class="sidebar__link sidebar__link--new" id="new-chat" type="button">New chat</button>
        <button class="sidebar__link" id="this-computer" type="button">This computer</button>
        <p class="sidebar__label">Recent</p>
        <nav class="sidebar__list" id="chat-list"></nav>
        <div class="sidebar__foot" id="me"></div>
      </aside>

      <main class="pane" id="pane">
        <section class="page" id="folders-page" hidden>
          <header class="page__head">
            <p class="eyebrow">This computer</p>
            <h1>Shared folders</h1>
            <p class="muted">Chat with Work can read these folders, and change files only where you allow it, each change approved by you.</p>
          </header>
          <div class="rows" id="connection"></div>
          <div class="rows" id="roots"></div>
        </section>

        <section class="chat" id="chat-page" hidden>
          <header class="chat__bar">
            <h1 class="chat__title" id="chat-title"></h1>
            <span class="tag" id="chat-model"></span>
          </header>
          <div class="conversation" id="conversation">
            <div class="conversation__column" id="messages"></div>
          </div>
          <form class="composer" id="composer">
            <div class="chat-prompt" id="prompt">
              <textarea id="question" rows="1" placeholder="Ask anything" aria-label="Your question"></textarea>
              <div class="chat-prompt__bar">
                <span class="micro" id="composer-note"></span>
                <button class="chat-prompt__send" id="send" type="submit" aria-label="Send">&#8593;</button>
              </div>
            </div>
          </form>
        </section>

        <section class="empty" id="empty-page">
          <p>Pick a chat, or start a new one.</p>
        </section>
      </main>
    </div>
  </body>
</html>
