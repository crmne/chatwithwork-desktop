# Shared CLI: gem install native-packages --version 0.10.0
# See PACKAGING.md.
---
schema: 1
tool:
  version: 0.10.0
  nfpm: 2.47.0
nfpm:
  name: chatwithwork-desktop
  maintainer: Carmine Paolino <carmine@paolino.me>
  vendor: Plenty
  homepage: https://chatwithwork.com
  description: |-
    Chat with Work Desktop: the desktop app, terminal interface and
    background agent.
    Chat with your assistant and share only the folders you choose.
    Includes the applications-menu entry, icon and systemd user service.
  license: MIT OR Apache-2.0
  provides: [cww]
  contents:
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/cww"
    dst: /usr/bin/cww
    file_info:
      mode: 493
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/packaging/systemd/cww.service"
    dst: /usr/lib/systemd/user/cww.service
    file_info:
      mode: 420
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/README.md"
    dst: /usr/share/doc/chatwithwork-desktop/README.md
    file_info:
      mode: 420
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/PROTOCOL.md"
    dst: /usr/share/doc/chatwithwork-desktop/PROTOCOL.md
    file_info:
      mode: 420
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/SECURITY.md"
    dst: /usr/share/doc/chatwithwork-desktop/SECURITY.md
    file_info:
      mode: 420
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/LICENSE-MIT"
    dst: /usr/share/licenses/chatwithwork-desktop/LICENSE-MIT
    file_info:
      mode: 420
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/LICENSE-APACHE"
    dst: /usr/share/licenses/chatwithwork-desktop/LICENSE-APACHE
    file_info:
      mode: 420
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/cww-app"
    dst: /usr/bin/cww-app
    file_info:
      mode: 493
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/cww-app.desktop"
    dst: /usr/share/applications/cww-app.desktop
    file_info:
      mode: 420
  - src: "@PAYLOAD@/cww-app-v@VERSION@-@TARGET@/cww-app.svg"
    dst: /usr/share/icons/hicolor/scalable/apps/cww-app.svg
    file_info:
      mode: 420
  scripts:
    postinstall: packaging/linux/postinstall.sh
  # ELF inspection adds libc/libgcc. The app's window is a WebKitGTK web
  # view in GTK 3, and its tray item loads the AppIndicator library at run
  # time, so declare them explicitly. The keyring and portal are optional.
  overrides:
    deb:
      # Ubuntu's libasound2 is virtual: prefer real ALSA over its incomplete
      # OSS compatibility provider. Other distributions still call ALSA
      # libasound2.
      # Dictation records through PipeWire's client library, renamed with
      # the t64 transition as ALSA's was.
      depends: ["libasound2t64 | libasound2", "libpipewire-0.3-0t64 | libpipewire-0.3-0", "libayatana-appindicator3-1 | libappindicator3-1"]
      recommends:
      - xdg-desktop-portal
      - gnome-keyring | kwalletmanager | keepassxc
      # Scanning: USB scanners through SANE, and searchable scans through
      # Tesseract. Loaded at run time; the app runs without them.
      - libsane1
      - tesseract-ocr
    rpm:
      depends: [alsa-lib, pipewire-libs]
      # The tray item. EPEL carries it on Rocky and RHEL; without it the app
      # runs without a tray item.
      recommends:
      - libayatana-appindicator-gtk3
      - xdg-desktop-portal
      - gnome-keyring
      - sane-backends-libs
      - sane-backends-drivers-scanners
      - tesseract
  rpm:
    buildhost: github-actions
targets:
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/cww-app-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: cww-app-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/cww-app-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: cww-app-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
# The packages that provide the libraries the app links (WebKitGTK and GTK
# for its windows, D-Bus for single instance); ELF inspection adds them.
libraries:
  libwebkit2gtk-4.1.so.0: { deb: libwebkit2gtk-4.1-0, rpm: webkit2gtk4.1 }
  libjavascriptcoregtk-4.1.so.0: { deb: libjavascriptcoregtk-4.1-0, rpm: javascriptcoregtk4.1 }
  libsoup-3.0.so.0: { deb: libsoup-3.0-0, rpm: libsoup3 }
  libgtk-3.so.0: { deb: "libgtk-3-0t64 | libgtk-3-0", rpm: gtk3 }
  libgdk-3.so.0: { deb: "libgtk-3-0t64 | libgtk-3-0", rpm: gtk3 }
  libgdk_pixbuf-2.0.so.0: { deb: "libgdk-pixbuf-2.0-0 | libgdk-pixbuf2.0-0", rpm: gdk-pixbuf2 }
  libcairo.so.2: { deb: libcairo2, rpm: cairo }
  libglib-2.0.so.0: { deb: "libglib2.0-0t64 | libglib2.0-0", rpm: glib2 }
  libgobject-2.0.so.0: { deb: "libglib2.0-0t64 | libglib2.0-0", rpm: glib2 }
  libgio-2.0.so.0: { deb: "libglib2.0-0t64 | libglib2.0-0", rpm: glib2 }
  libdbus-1.so.3: { deb: libdbus-1-3, rpm: dbus-libs }
release:
  repository: crmne/chatwithwork-desktop
  checksums: checksums.txt
  prereleases: true
assets:
  LINUX_APP_AMD64:
    file: cww-app-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/cww-app-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  LINUX_APP_ARM64:
    file: cww-app-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/cww-app-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  AMD64:
    file: cww-v@VERSION@-x86_64-unknown-linux-musl.tar.gz
    local: dist/cww-v@VERSION@-x86_64-unknown-linux-musl.tar.gz
  ARM64:
    file: cww-v@VERSION@-aarch64-unknown-linux-musl.tar.gz
    local: dist/cww-v@VERSION@-aarch64-unknown-linux-musl.tar.gz
  # Built, signed and notarized by the release workflow's macOS job.
  MACOS:
    file: cww-v@VERSION@-macos-universal.tar.gz
    local: dist/cww-v@VERSION@-macos-universal.tar.gz
  # The desktop app's notarized disk image, for the Homebrew cask.
  MACOS_APP:
    file: chat-with-work-v@VERSION@-macos-universal.dmg
    local: dist/chat-with-work-v@VERSION@-macos-universal.dmg
  # Built (and signed, when the Windows secrets exist) by the release
  # workflow's Windows jobs.
  WINDOWS_X64_MSI:
    file: cww-v@VERSION@-x86_64-pc-windows-msvc.msi
    local: dist/cww-v@VERSION@-x86_64-pc-windows-msvc.msi
  WINDOWS_ARM64_MSI:
    file: cww-v@VERSION@-aarch64-pc-windows-msvc.msi
    local: dist/cww-v@VERSION@-aarch64-pc-windows-msvc.msi
  SOURCE:
    file: chatwithwork-desktop-@VERSION@.tar.gz
    url: https://github.com/crmne/chatwithwork-desktop/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/chatwithwork-desktop-@VERSION@.tar.gz
templates:
  homebrew/Formula/cww.rb: packaging/homebrew/cww.rb.in
  homebrew/Casks/chat-with-work.rb: packaging/homebrew/chat-with-work.rb.in
  arch/chatwithwork-desktop/PKGBUILD: packaging/arch/chatwithwork-desktop/PKGBUILD.in
  arch/chatwithwork-desktop/chatwithwork-desktop.install: packaging/arch/cww.install
  arch/chatwithwork-desktop-bin/PKGBUILD: packaging/arch/chatwithwork-desktop-bin/PKGBUILD.in
  arch/chatwithwork-desktop-bin/chatwithwork-desktop-bin.install: packaging/arch/cww.install
  arch/chatwithwork-desktop-git/PKGBUILD: packaging/arch/chatwithwork-desktop-git/PKGBUILD.in
  arch/chatwithwork-desktop-git/chatwithwork-desktop-git.install: packaging/arch/cww.install
  winget/ChatWithWork.Desktop.yaml: packaging/winget/ChatWithWork.Desktop.yaml.in
  winget/ChatWithWork.Desktop.installer.yaml: packaging/winget/ChatWithWork.Desktop.installer.yaml.in
  winget/ChatWithWork.Desktop.locale.en-US.yaml: packaging/winget/ChatWithWork.Desktop.locale.en-US.yaml.in
repositories:
  homebrew:
    url: https://github.com/crmne/homebrew-tap.git
    push_url: https://github.com/crmne/homebrew-tap.git
    branch: main
    package_path: "."
    files:
      homebrew/Formula/cww.rb: Formula/cww.rb
      homebrew/Casks/chat-with-work.rb: Casks/chat-with-work.rb
    version_file: Formula/cww.rb
    version_pattern: 'version "([^"]+)"'
    publish: push
  aur-source:
    group: aur
    url: https://aur.archlinux.org/chatwithwork-desktop.git
    push_url: ssh://aur@aur.archlinux.org/chatwithwork-desktop.git
    branch: master
    package_path: "."
    files:
      arch/chatwithwork-desktop: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/chatwithwork-desktop-bin.git
    push_url: ssh://aur@aur.archlinux.org/chatwithwork-desktop-bin.git
    branch: master
    package_path: "."
    files:
      arch/chatwithwork-desktop-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/chatwithwork-desktop-git.git
    push_url: ssh://aur@aur.archlinux.org/chatwithwork-desktop-git.git
    branch: master
    package_path: "."
    files:
      arch/chatwithwork-desktop-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
# WinGet's recipes are rendered with the others (recipes/winget) and
# submitted by hand with packaging/windows/winget-submit.sh; see PACKAGING.md.
version_file: Cargo.toml
