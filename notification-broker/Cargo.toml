[package]
name = "cww-notification-broker"
version = "0.3.1"
edition = "2024"
rust-version = "1.98"
description = "Private native notification helper for Chat with Work"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crmne/chatwithwork-local-agent"
publish = false

[[bin]]
name = "cww-notify"
path = "src/main.rs"

[dependencies]
cww = { path = ".." }
anyhow = "1"
serde_json = "1"
pollster = "0.4"
tokio = { version = "1.53", features = ["sync", "macros"] }
# Same owner-approved revision as every Fastframe dependency in app/.
fastframe-notifications = { version = "0.8.1", git = "https://github.com/crmne/fastframe", rev = "6699f993d61af09719d8d61a02a345119226b056" }
