[package]
name = "cww-notification-broker"
version = "0.11.1"
edition = "2024"
rust-version = "1.98"
description = "Private native notification helper for Chat with Work"
license = "GPL-3.0-only"
repository = "https://github.com/crmne/chatwithwork-desktop"
publish = false

[[bin]]
name = "cww-notify"
path = "src/main.rs"

[dependencies]
cww = { path = ".." }
anyhow = "1"
serde_json = "1"
pollster = "1.0"
tokio = { version = "1.53", features = ["sync", "macros"] }
# Same owner-approved revision as every Fastframe dependency in app/.
fastframe-notifications = { version = "0.15.6", git = "https://github.com/crmne/fastframe", rev = "09c22df0784bc2dedd4b7930e2625b4c8c649be5" }
