[package]
name = "cww-scan"
version = "0.9.0"
edition = "2024"
rust-version = "1.90"
description = "Chat with Work Desktop's scanning: USB scanners through the system (SANE, ImageCaptureCore, WIA), blank pages, OCR on the computer and searchable PDFs"
license = "MIT OR Apache-2.0"
authors = ["Carmine Paolino <carmine@paolino.me>"]
repository = "https://github.com/crmne/chatwithwork-desktop"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Page images: reading what the helper wrote (PNM), cropping, turning,
# thumbnails (JPEG) and the PNG handed to Tesseract.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
# The searchable PDF: the scanned pages as images, and an invisible text
# layer over them.
pdf-writer = "0.15"
# Black-and-white pages and the text layer's font streams.
flate2 = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# libsane is loaded at run time, from the distribution's package, never
# shipped: its backends are GPL with an exception for frontends that load
# them, and a computer without SANE still runs the app.
libloading = "0.9"

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
# Apple's Vision reads pages on a Mac, with word boxes, in every language it
# knows; built into macOS, nothing to download.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"

[target.'cfg(windows)'.dependencies]
# TWAIN: the data source manager is loaded at run time, the hidden window
# and message loop a TWAIN source needs come from Win32.
libloading = "0.9"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# Windows' own OCR (Windows.Media.Ocr), built into Windows 10 and 11.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_WinRT",
] }

# The scanner's helper as a program of its own. On Windows it's built for
# 32-bit x86 too, since most TWAIN drivers are 32-bit and load only into a
# 32-bit process; the 64-bit app starts it and talks to it over a pipe.
[[bin]]
name = "cww-scan-helper"
path = "src/bin/cww-scan-helper.rs"
